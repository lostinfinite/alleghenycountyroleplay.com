<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/assets/cdn-fallback.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy — Change Comparison | Allegheny County Roleplay</title>
  <meta name="description" content="Compare changes between versions of the ACRP Privacy Policy.">
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.alleghenycountyroleplay.com/branding/acrp-wite.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    :root {
      --brand: var(--brand, oklch(0.78 0.165 75));
      --brand-dim: rgba(255,187,0,0.12);
      --bg: #1D1D1D;
      --surface: #121214;
      --card: #141417;
      --text: #fff;
      --muted: #bdbdbd;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 20px 60px rgba(0,0,0,0.35);

      --del-bg: rgba(255,80,80,0.15);
      --del-text: #ff9090;
      --ins-bg: rgba(60,200,100,0.15);
      --ins-text: #78e08f;

      --badge-changed: rgba(255,165,0,0.15);
      --badge-changed-text: #ffa500;
      --badge-added: rgba(60,200,100,0.15);
      --badge-added-text: #78e08f;
      --badge-removed: rgba(255,80,80,0.15);
      --badge-removed-text: #ff9090;
      --badge-unchanged: rgba(255,255,255,0.07);
      --badge-unchanged-text: #888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter Tight', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 13px; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── nav (shared localnav style) ── */
    .simple-localnav {
      position: sticky; top: 6px; z-index: 9999;
      display: flex; justify-content: center;
      padding-block: 4px; margin-top: 6px;
      --progress: 0;
    }
    .simple-localnav .localnav-inner {
      width: 100%; max-width: 1024px;
      background: #16161a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding-block: 8px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 4px 14px rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding-inline: 12px; min-height: 48px;
    }
    .simple-localnav .brand { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 13px; }
    .simple-localnav .brand img { width: 40px; height: 40px; border-radius: 6px; }
    .simple-localnav .actions a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: .5rem .8rem; border-radius: 10em;
      text-decoration: none; color: var(--text);
      border: 1px solid rgba(255,255,255,0.1); background: transparent;
    }
    .simple-localnav .actions a.btn { background: var(--brand); color: #000; border: none; font-weight: 600; }
    @media (max-width:600px) {
      .simple-localnav .brand span { display: none; }
    }

    /* ── page layout ── */
    .page-wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }

    .compare-hero {
      padding: 28px 4px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .compare-hero h1 {
      font-size: 22px; font-weight: 600; margin-bottom: 6px;
      color: var(--brand);
    }
    .compare-hero p { color: var(--muted); font-size: 13px; }

    .version-bar {
      display: flex; align-items: center; gap: 10px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .version-chip {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px; font-size: 12px;
    }
    .version-chip .label { color: var(--muted); }
    .version-chip .ver { font-weight: 600; color: var(--text); margin-left: 4px; }
    .version-chip .date { color: var(--muted); margin-left: 6px; }
    .arrow { color: var(--muted); font-size: 18px; }

    .summary-row {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .summary-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 10em; font-size: 12px; font-weight: 500;
    }
    .summary-chip.changed { background: var(--badge-changed); color: var(--badge-changed-text); border: 1px solid rgba(255,165,0,0.2); }
    .summary-chip.added   { background: var(--badge-added);   color: var(--badge-added-text);   border: 1px solid rgba(60,200,100,0.2); }
    .summary-chip.unchanged { background: var(--badge-unchanged); color: var(--badge-unchanged-text); border: 1px solid rgba(255,255,255,0.06); }

    /* ── filters ── */
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
    .filter-btn {
      padding: 6px 14px; border-radius: 10em; font-size: 12px; font-weight: 500;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      cursor: pointer; transition: all .15s ease;
    }
    .filter-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .filter-btn.active { background: var(--brand); color: #000; border-color: transparent; }

    /* ── section cards ── */
    .section-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 14px; overflow: hidden;
    }
    .section-card.--added   { border-left: 3px solid var(--badge-added-text); }
    .section-card.--changed { border-left: 3px solid var(--badge-changed-text); }
    .section-card.--removed { border-left: 3px solid var(--badge-removed-text); }
    .section-card.--unchanged { opacity: 0.6; }
    .section-card.hidden { display: none; }

    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; gap: 12px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    .card-header:hover { background: rgba(255,255,255,0.02); }
    .section-card.--unchanged .card-header { border-bottom: none; }

    .card-title { font-size: 14px; font-weight: 600; }
    .card-badge {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 10em; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .card-badge.changed   { background: var(--badge-changed);   color: var(--badge-changed-text); }
    .card-badge.added     { background: var(--badge-added);     color: var(--badge-added-text); }
    .card-badge.removed   { background: var(--badge-removed);   color: var(--badge-removed-text); }
    .card-badge.unchanged { background: var(--badge-unchanged); color: var(--badge-unchanged-text); }

    .card-chevron { color: var(--muted); font-size: 12px; transition: transform .2s ease; }
    .section-card.expanded .card-chevron { transform: rotate(180deg); }

    .card-body {
      padding: 18px 18px 20px;
      font-size: 12px;
      line-height: 1.9;
      color: var(--muted);
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .section-card.expanded .card-body { display: block; }
    .section-card.--unchanged .card-body { padding: 12px 18px; color: #666; font-style: italic; display: block; }

    /* ── diff styling ── */
    del {
      background: var(--del-bg); color: var(--del-text);
      text-decoration: line-through; border-radius: 3px;
      padding: 0 2px;
    }
    ins {
      background: var(--ins-bg); color: var(--ins-text);
      text-decoration: none; border-radius: 3px;
      padding: 0 2px;
    }

    .diff-legend {
      display: flex; gap: 16px; align-items: center;
      padding: 10px 14px; background: rgba(255,255,255,0.02);
      border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 20px; font-size: 11px; flex-wrap: wrap;
    }
    .diff-legend span { display: flex; align-items: center; gap: 6px; color: var(--muted); }

    @media (max-width: 600px) {
      .card-header { padding: 12px 14px; }
      .card-body { padding: 14px; }
      .version-bar { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .page-wrap { padding: 16px 12px 40px; }
      .compare-hero h1 { font-size: 18px; }
      .compare-hero p { font-size: 12px; }
      .diff-legend { flex-direction: column; gap: 8px; padding: 10px 12px; }
      .filter-bar { gap: 4px; }
      .filter-btn { padding: 5px 11px; font-size: 11px; }
      .card-title { font-size: 13px; }
    }
  </style>
  <script src="/assets/acrp-localnav.js" defer></script>
</head>
<body data-acrp-nav="default" data-acrp-nav-name="Privacy — Compare">

<!-- Navigation injected by /assets/acrp-localnav.js -->

<main class="page-wrap" id="main">

  <div class="compare-hero">
    <h1>Privacy Policy — Change Comparison</h1>
    <p>A word-level diff of every section between published policy versions. Removed text is highlighted in red; added text is highlighted in green.</p>
  </div>

  <div class="version-bar" id="versionBar"><!-- filled by JS --></div>

  <div class="summary-row" id="summaryRow"><!-- filled by JS --></div>

  <div class="diff-legend" aria-label="Diff legend">
    <span><del>removed text</del></span>
    <span><ins>added text</ins></span>
    <span style="display:flex;gap:5px;align-items:center;">
      <span class="card-badge added" style="font-size:10px;">Added</span> new section
    </span>
    <span style="display:flex;gap:5px;align-items:center;">
      <span class="card-badge changed" style="font-size:10px;">Modified</span> section with changes
    </span>
    <span style="display:flex;gap:5px;align-items:center;">
      <span class="card-badge unchanged" style="font-size:10px;">Unchanged</span> no changes
    </span>
  </div>

  <div class="filter-bar" id="filterBar" role="group" aria-label="Filter sections">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="changed">Modified</button>
    <button class="filter-btn" data-filter="added">Added</button>
    <button class="filter-btn" data-filter="unchanged">Unchanged</button>
  </div>

  <div id="sectionList" aria-live="polite"><!-- filled by JS --></div>

</main>

<script src="/legal/policy-history.js"></script>
<script>
(function () {
  'use strict';

  /* ── Diff engine ─────────────────────────────────────────── */

  function tokenize(text) {
    return text.match(/\S+|\s+/g) || [];
  }

  function computeDiff(oldText, newText) {
    const a = tokenize(oldText);
    const b = tokenize(newText);

    // Safety cap — if either side is very large, skip word-level diff
    if (a.length > 5000 || b.length > 5000) {
      return null; // signal "too large"
    }

    const m = a.length, n = b.length;
    // Uint16 caps at 65535 — fine for policy text
    const dp = new Array(m + 1);
    for (let i = 0; i <= m; i++) dp[i] = new Uint16Array(n + 1);

    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        if (a[i - 1] === b[j - 1]) {
          dp[i][j] = dp[i - 1][j - 1] + 1;
        } else {
          dp[i][j] = dp[i - 1][j] > dp[i][j - 1] ? dp[i - 1][j] : dp[i][j - 1];
        }
      }
    }

    // Backtrack
    const ops = [];
    let i = m, j = n;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
        ops.push({ t: '=', v: a[i - 1] });
        i--; j--;
      } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
        ops.push({ t: '+', v: b[j - 1] });
        j--;
      } else {
        ops.push({ t: '-', v: a[i - 1] });
        i--;
      }
    }
    ops.reverse();
    return ops;
  }

  function esc(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  function renderDiff(ops) {
    let html = '';
    let i = 0;
    while (i < ops.length) {
      const op = ops[i];
      if (op.t === '=') {
        html += esc(op.v);
        i++;
      } else {
        // Collect a run of dels then ins
        const dels = [], ins = [];
        while (i < ops.length && (ops[i].t === '-' || ops[i].t === '+')) {
          if (ops[i].t === '-') dels.push(ops[i].v);
          else ins.push(ops[i].v);
          i++;
        }
        if (dels.length) html += '<del>' + esc(dels.join('')) + '</del>';
        if (ins.length)  html += '<ins>' + esc(ins.join('')) + '</ins>';
      }
    }
    return html;
  }

  /* ── Section comparison ──────────────────────────────────── */

  function compareSections(fromSections, toSections) {
    const fromMap = Object.fromEntries(fromSections.map(s => [s.id, s]));
    const toMap   = Object.fromEntries(toSections.map(s => [s.id, s]));

    // Walk new version in order, then append removed sections at end
    const results = [];
    const seen = new Set();

    for (const newSec of toSections) {
      seen.add(newSec.id);
      const oldSec = fromMap[newSec.id];
      if (!oldSec) {
        results.push({ status: 'added', newSec, oldSec: null });
      } else if (oldSec.text.trim() === newSec.text.trim()) {
        results.push({ status: 'unchanged', newSec, oldSec });
      } else {
        results.push({ status: 'changed', newSec, oldSec });
      }
    }

    for (const oldSec of fromSections) {
      if (!seen.has(oldSec.id)) {
        results.push({ status: 'removed', newSec: null, oldSec });
      }
    }

    return results;
  }

  /* ── Render ──────────────────────────────────────────────── */

  function buildSectionCard(item) {
    const { status, newSec, oldSec } = item;
    const title = (newSec || oldSec).title;

    let bodyHTML = '';

    if (status === 'unchanged') {
      bodyHTML = '<em>No changes in this section.</em>';
    } else if (status === 'added') {
      bodyHTML = esc(newSec.text);
    } else if (status === 'removed') {
      bodyHTML = '<del>' + esc(oldSec.text) + '</del>';
    } else {
      // changed — word diff
      const ops = computeDiff(oldSec.text, newSec.text);
      if (ops === null) {
        // Too large — show a simple note
        bodyHTML =
          '<em style="color:var(--muted);">Section is too large for inline diff. ' +
          'View the <a href="/privacy">current policy</a> for the latest text.</em>';
      } else {
        bodyHTML = renderDiff(ops);
      }
    }

    const badgeClass = status === 'changed' ? 'changed'
                     : status === 'added'   ? 'added'
                     : status === 'removed' ? 'removed'
                     : 'unchanged';

    const badgeLabel = status === 'changed'   ? '&#9679; Modified'
                     : status === 'added'     ? '&#43; Added'
                     : status === 'removed'   ? '&#8722; Removed'
                     : 'Unchanged';

    const isAutoExpand = (status !== 'unchanged');

    const card = document.createElement('div');
    card.className = 'section-card --' + status + (isAutoExpand ? ' expanded' : '');
    card.dataset.status = status;
    card.innerHTML =
      '<div class="card-header" role="button" aria-expanded="' + isAutoExpand + '" tabindex="0">' +
        '<span class="card-title">' + esc(title) + '</span>' +
        '<span style="display:flex;align-items:center;gap:8px;">' +
          '<span class="card-badge ' + badgeClass + '">' + badgeLabel + '</span>' +
          (status !== 'unchanged' ? '<span class="card-chevron">▲</span>' : '') +
        '</span>' +
      '</div>' +
      '<div class="card-body">' + bodyHTML + '</div>';

    // Toggle on click / keyboard
    card.querySelector('.card-header').addEventListener('click', () => {
      if (status === 'unchanged') return;
      card.classList.toggle('expanded');
      const hdr = card.querySelector('.card-header');
      hdr.setAttribute('aria-expanded', card.classList.contains('expanded'));
    });
    card.querySelector('.card-header').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.querySelector('.card-header').click(); }
    });

    return card;
  }

  /* ── Init ────────────────────────────────────────────────── */

  function init() {
    if (!window.POLICY_ARCHIVE || POLICY_ARCHIVE.length < 2) {
      document.getElementById('sectionList').innerHTML =
        '<div style="padding:24px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--muted);">' +
          '<p style="color:var(--text);font-weight:600;margin:0 0 6px;">Policy archive isn\'t loaded</p>' +
          '<p style="margin:0 0 12px;font-size:13px;">The archive script (<code>policy-history.js</code>) didn\'t load, or fewer than two versions are recorded yet — there\'s nothing to compare.</p>' +
          '<p style="margin:0 0 12px;font-size:13px;">Try a hard refresh (Ctrl+Shift+R), or reach out if it keeps failing.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button onclick="location.reload()" style="padding:.45rem .9rem;background:var(--brand);color:#000;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px;">Reload page</button>' +
            '<a href="/privacy" style="padding:.45rem .9rem;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:6px;text-decoration:none;font-size:13px;">View current policy</a>' +
            '<a href="mailto:legal@alleghenycountyroleplay.com" style="padding:.45rem .9rem;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:6px;text-decoration:none;font-size:13px;">Report problem</a>' +
          '</div>' +
        '</div>';
      return;
    }

    const fromVer = POLICY_ARCHIVE[POLICY_ARCHIVE.length - 2];
    const toVer   = POLICY_ARCHIVE[POLICY_ARCHIVE.length - 1];

    // Version bar
    document.getElementById('versionBar').innerHTML =
      '<div class="version-chip"><span class="label">From</span><span class="ver">v' + fromVer.version + '</span>' +
        '<span class="date">— </span><span class="date">Last updated ' + fromVer.lastUpdated + '</span></div>' +
      '<span class="arrow">→</span>' +
      '<div class="version-chip"><span class="label">To</span><span class="ver">v' + toVer.version + '</span>' +
        '<span class="date">— </span><span class="date">Last updated ' + toVer.lastUpdated + '</span></div>';

    const comparisons = compareSections(fromVer.sections, toVer.sections);

    // Summary
    const counts = { changed: 0, added: 0, removed: 0, unchanged: 0 };
    comparisons.forEach(c => counts[c.status]++);
    const summaryRow = document.getElementById('summaryRow');
    if (counts.changed)   summaryRow.innerHTML += '<span class="summary-chip changed">&#9679; ' + counts.changed   + ' modified</span>';
    if (counts.added)     summaryRow.innerHTML += '<span class="summary-chip added">&#43; '    + counts.added     + ' added</span>';
    if (counts.removed)   summaryRow.innerHTML += '<span class="summary-chip removed">&#8722; '+ counts.removed   + ' removed</span>';
    if (counts.unchanged) summaryRow.innerHTML += '<span class="summary-chip unchanged">'      + counts.unchanged + ' unchanged</span>';

    // Render section cards
    const list = document.getElementById('sectionList');
    comparisons.forEach(item => {
      list.appendChild(buildSectionCard(item));
    });

    // Filter buttons
    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      const filter = btn.dataset.filter;

      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.section-card').forEach(card => {
        const status = card.dataset.status;
        if (filter === 'all') {
          card.classList.remove('hidden');
        } else {
          card.classList.toggle('hidden', status !== filter);
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

<script src="/master.js"></script>
</body>
</html>

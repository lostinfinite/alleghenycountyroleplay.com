<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/assets/cdn-fallback.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Allegheny County Roleplay</title>
  <link rel="icon" type="image/png" href="https://cdn.alleghenycountyroleplay.com/branding/acrp-wite.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/acrp-localnav.js" defer></script>
  <script src="https://uptime.betterstack.com/widgets/announcement.js" data-id="227840" async type="text/javascript"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background: #0f0c0a;
      color: #f4eee7;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    :root {
      --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }


    .hero {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      min-height: max(640px, 100svh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0f0c0a;
    }

    /* Full-bleed dotted grid, masked to a soft oval */
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1px, transparent 1.6px);
      background-size: 24px 24px;
      -webkit-mask-image: radial-gradient(ellipse 70% 75% at 50% 50%, #000 35%, transparent 92%);
              mask-image: radial-gradient(ellipse 70% 75% at 50% 50%, #000 35%, transparent 92%);
      transform: translate3d(0, 0, 0);
      will-change: transform, opacity;
    }

    /* Dashed horizontal rules at top + bottom of hero */
    .hero-rule {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 200dvw;
      height: 1px;
      z-index: 2;
      pointer-events: none;
      background-image: linear-gradient(
        to right,
        rgba(255,255,255,0.18) 0,
        rgba(255,255,255,0.18) 8px,
        transparent 8px,
        transparent 16px
      );
      background-size: 16px 1px;
      background-repeat: repeat-x;
    }
    .hero-rule.top    { top: 0; }
    .hero-rule.bottom { bottom: 0; }

    /* ─── Hero content column ─── */
    .hero-inner {
      position: relative;
      z-index: 3;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 4rem;
    }

    /* ─── Massive 404 glyph ─── */
    .glyph {
      width: min(88%, 820px);
      aspect-ratio: 673 / 277;
      display: block;
      transform-origin: center;
      will-change: transform, opacity;
    }
    .glyph text {
      font-family: 'Inter Tight', system-ui, sans-serif;
      font-weight: 800;
      font-size: 277px;            /* matches viewBox height ratio */
      letter-spacing: -0.05em;
    }

    /* ─── Copy + CTAs ─── */
    .copy {
      margin-top: 1.75rem;
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .copy { margin-top: 2rem; gap: 2rem; }
    }
    .copy p {
      font-size: 1rem;
      line-height: 1.55;
      color: rgba(244,238,231,0.80);
      margin: 0;
      text-wrap: balance;
    }
    @media (min-width: 768px) {
      .copy p { font-size: 1.05rem; }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    @media (min-width: 768px) {
      .actions { gap: 1rem; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.95rem 1.75rem;
      font-family: 'Inter Tight', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1;
      border-radius: 12px;
      border: 1px solid transparent;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      transition: background 0.2s var(--ease-out-quart), border-color 0.2s var(--ease-out-quart), color 0.2s var(--ease-out-quart), transform 0.16s var(--ease-out-expo), opacity 0.16s var(--ease-out-quart), box-shadow 0.2s var(--ease-out-quart);
      backdrop-filter: blur(8px);
    }
    @media (min-width: 768px) {
      .btn { border-radius: 999px; padding: 0.85rem 1.65rem; }
    }
    .btn:active { transform: translateY(1px) scale(0.985); }
    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(246,130,31,0.28);
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.12), transparent);
      transform: translateX(-120%);
      transition: transform 0.55s var(--ease-out-expo);
      pointer-events: none;
    }
    .btn:hover::after,
    .btn:focus-visible::after {
      transform: translateX(120%);
    }

    .btn-primary {
      background: #f6821f;            /* Cloudflare-like accent — sits well with ACRP amber */
      border-color: #f6821f;
      color: #1a0e07;
    }
    .btn-primary:hover {
      background: #ff9133;
      border-color: #fff;
      opacity: 0.97;
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.16);
      color: #f4eee7;
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(246,130,31,0.4);
      color: rgba(246,130,31,0.85);
      transform: translateY(-1px);
    }

    /* ─── Responsive ─── */
    @media (max-width: 720px) {
      .glyph { width: 92%; }
    }

    /* ─── Motion ─── */
    @media (prefers-reduced-motion: no-preference) {
      .hero-bg { animation: drift 18s var(--ease-out-quart) infinite alternate; }
      .glyph { animation: rise 0.62s var(--ease-out-quint) both; }
      .copy  { animation: rise 0.62s var(--ease-out-quint) 0.12s both; }
      .hero-rule { animation: fade 1.1s var(--ease-out-quint) both; }
      .copy p { animation: fade 0.55s var(--ease-out-quart) 0.2s both; }
      .hatch-layer { animation: hatchPulse 6.8s var(--ease-out-quart) infinite alternate; }

      @keyframes drift {
        from { transform: translate3d(0, 0, 0); opacity: 0.95; }
        to   { transform: translate3d(-10px, -6px, 0); opacity: 1; }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px) scale(0.988); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes fade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes hatchPulse {
        from { opacity: 0.48; }
        to   { opacity: 0.58; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-bg,
      .glyph,
      .copy,
      .copy p,
      .hero-rule,
      .hatch-layer,
      .btn,
      .btn::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
      .btn::after { display: none; }
    }
  </style>
</head>
<body data-acrp-nav="default" data-acrp-nav-short="ACRP" data-acrp-nav-name-href="/index.html">

  <section class="hero">
    <!-- Background layers -->
    <div class="hero-bg"    aria-hidden="true"></div>
    <div class="hero-rule top"    aria-hidden="true"></div>
    <div class="hero-rule bottom" aria-hidden="true"></div>

    <!-- Hero content -->
    <div class="hero-inner">
      <!-- Massive textured 404 -->
      <svg class="glyph" viewBox="0 0 673 277" role="img" aria-label="404">
        <defs>
          <!-- Dot grid in deep red-orange (matches reference) -->
          <pattern id="dots" x="0" y="0" width="7" height="7" patternUnits="userSpaceOnUse">
            <rect width="7" height="7" fill="#1a0e07"/>
            <circle cx="3.5" cy="3.5" r="1.6" fill="#c43511"/>
          </pattern>

          <!-- Diagonal cross-hatch overlay -->
          <pattern id="hatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="6" height="6" fill="transparent"/>
            <rect width="1" height="6" fill="rgba(0,0,0,0.35)"/>
          </pattern>

          <!-- Outline gradient -->
          <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="rgba(255, 130, 60, 0.85)"/>
            <stop offset="100%" stop-color="rgba(160, 40, 10, 0.75)"/>
          </linearGradient>

          <!-- Mask = the 404 shape -->
          <mask id="glyph-mask">
            <text x="50%" y="84%" text-anchor="middle" fill="#fff">404</text>
          </mask>
        </defs>

        <!-- 1. Solid base in deep red so dots have a colored backdrop -->
        <text x="50%" y="84%" text-anchor="middle" fill="#7a1f08">404</text>

        <!-- 2. Dot grid pattern -->
        <g mask="url(#glyph-mask)">
          <rect width="100%" height="100%" fill="url(#dots)"/>
          <!-- 3. Cross-hatch on top of dots -->
          <rect class="hatch-layer" width="100%" height="100%" fill="url(#hatch)" opacity="0.55"/>
        </g>

        <!-- 5. Crisp outline -->
        <text x="50%" y="84%" text-anchor="middle" fill="none"
              stroke="url(#edge)" stroke-width="1.4">404</text>
      </svg>

      <div class="copy">
        <h1 class="sr-only">404 — Page not found</h1>
        <p>We can't find the page you were looking for. It may have been moved,
           renamed, or no longer exists.</p>
        <div class="actions">
          <a class="btn btn-primary" href="/index.html">Take me home</a>
          <a class="btn btn-ghost"   href="https://portal.alleghenycountyroleplay.com">Open the portal</a>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>

  <style>
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>

  <script src="toasts.js"></script>
  <script src="notify.js"></script>
  <script src="snow.js"></script>
  <script src="master.js"></script>
</body>
</html>

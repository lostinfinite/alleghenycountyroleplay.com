<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deprecated &mdash; ACRP</title>
  <link rel="icon" type="image/png" href="https://cdn.alleghenycountyroleplay.com/branding/acrp-wite.png" sizes="32x32">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="6; url=https://portal.alleghenycountyroleplay.com">
  <link rel="canonical" href="https://portal.alleghenycountyroleplay.com">
  <style>
    :root {
      --bg: oklch(0.188 0.018 70);
      --surface: oklch(0.232 0.020 70);
      --rule: oklch(0.32 0.012 70);
      --ink: oklch(0.95 0.012 80);
      --ink-dim: oklch(0.78 0.012 80);
      --ink-mute: oklch(0.58 0.014 75);
      --amber: oklch(0.78 0.165 75);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 520px;
      margin: 24px;
      padding: 40px 36px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 12px;
      text-align: center;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin: 0 0 16px;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 14px;
      line-height: 1.2;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-dim);
      margin: 0 0 22px;
    }
    .cta {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 980px;
      background: var(--amber);
      color: oklch(0.18 0.012 70);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: filter 0.15s ease;
    }
    .cta:hover { filter: brightness(1.05); }
    .meta {
      margin-top: 18px;
      font-size: 12px;
      color: var(--ink-mute);
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Notice</p>
    <h1>This feature has been deprecated.</h1>
    <p>The standalone Department Information System has been retired. All department resources, invites, and operational tools now live in the ACRP Portal.</p>
    <a class="cta" href="https://portal.alleghenycountyroleplay.com">Go to the Portal &rarr;</a>
    <p class="meta">You will be redirected automatically in a few seconds.</p>
  </main>
  <script>
    setTimeout(function () {
      window.location.replace('https://portal.alleghenycountyroleplay.com');
    }, 6000);
  </script>
</body>
</html>

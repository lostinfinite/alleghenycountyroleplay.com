<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Articles & Announcements - Allegheny County Roleplay</title>
	<meta name="description" content="Browse announcements, safety resources, and legal documents for the ACRP community.">
	<link rel="icon" type="image/png" href="https://cdn.alleghenycountyroleplay.com/branding/acrp-wite.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../assets/site.css">

	<style>
		:root {
			--brand: #FFBB00;
			--bg: #0e0e10;
			--surface: #121214;
			--card: #18181b;
			--card-hover: #1e1e22;
			--text: #fff;
			--muted: #bdbdbd;
			--border: rgba(255,255,255,.08);
			--radius: 14px;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }
		body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
		a { color: var(--brand); text-decoration: none; }
		a:hover { text-decoration: underline; }

		/* ── Nav ── */
		.simple-localnav { position: sticky; top: 6px; z-index: 9999; display: flex; justify-content: center; padding-block: 4px; margin-top: 6px; }
		.simple-localnav .localnav-inner { width: min(1024px, 94vw); background: rgba(30,30,36,0.80); border: 1px solid rgba(255,255,255,0.10); border-radius: 18px; padding: 8px 14px; backdrop-filter: blur(24px) saturate(160%); box-shadow: 0 8px 30px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
		.simple-localnav .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; }
		.simple-localnav .brand img { width: 34px; height: 34px; border-radius: 6px; }
		.simple-localnav .actions { display: flex; gap: 8px; }
		.simple-localnav .actions a { padding: .4rem .8rem; border-radius: 10em; color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,0.10); transition: background .15s; }
		.simple-localnav .actions a:hover { background: rgba(255,255,255,0.06); text-decoration: none; }
		.simple-localnav .actions a.btn { background: var(--brand); color: #000; border-color: transparent; font-weight: 700; }
		.simple-localnav .actions a.btn:hover { background: #e6a800; }
		@media (max-width: 600px) { .simple-localnav .brand span { display: none; } }

		/* ── Hero ── */
		.hero-ar {
			text-align: center;
			padding: 56px 20px 40px;
		}
		.hero-ar-title {
			font-size: clamp(36px, 7vw, 64px);
			font-weight: 900;
			line-height: 1.0;
			letter-spacing: -.02em;
			color: var(--text);
			margin-bottom: 16px;
		}
		.hero-ar-sub {
			font-size: 15px;
			color: var(--muted);
			max-width: 420px;
			margin: 0 auto 28px;
			line-height: 1.6;
		}

		/* ── Search ── */
		.search-wrap { display: flex; justify-content: center; }
		.search-inner { position: relative; width: 100%; max-width: 520px; }
		.search-input {
			width: 100%;
			padding: 14px 52px 14px 20px;
			border-radius: 10em;
			border: 1px solid rgba(255,255,255,0.10);
			background: rgba(255,255,255,0.04);
			color: var(--text);
			font-size: 15px;
			font-family: inherit;
			transition: border-color .18s, box-shadow .18s;
		}
		.search-input::placeholder { color: var(--muted); }
		.search-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,187,0,.10); }
		.search-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; display: inline-flex; padding: 4px; }
		.search-btn:hover { color: var(--brand); }
		.search-btn svg { width: 18px; height: 18px; display: block; }

		/* ── Sections ── */
		.section { max-width: 1100px; margin: 0 auto; padding: 48px 20px; }
		.section + .section { padding-top: 0; }

		.section-title {
			font-size: clamp(18px, 3vw, 24px);
			font-weight: 700;
			color: var(--text);
			margin-bottom: 24px;
		}

		/* ── Article cards (unified, 3-col) ── */
		.article-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 18px;
		}
		@media (max-width: 800px) { .article-grid { grid-template-columns: repeat(2, 1fr); } }
		@media (max-width: 500px) { .article-grid { grid-template-columns: 1fr; } }

		.article-card {
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			overflow: hidden;
			text-decoration: none;
			color: inherit;
			display: flex;
			flex-direction: column;
			transition: background .18s, transform .18s, box-shadow .18s;
		}
		.article-card:hover { background: var(--card-hover); transform: translateY(-3px); box-shadow: 0 14px 40px rgba(0,0,0,.45); text-decoration: none; }
		.article-card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface); }
		.article-card-img.logo { object-fit: contain; padding: 24px; }
		.article-card-body { padding: 14px 16px 18px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
		.article-card-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--brand); }
		.article-card-date { font-size: 11px; color: var(--muted); }
		.article-card-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; margin-top: 2px; }

		/* ── Document list (legal links) ── */
		.doc-list { display: flex; flex-direction: column; gap: 4px; }
		.doc-item {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 12px 14px;
			border-radius: 10px;
			border: 1px solid var(--border);
			background: var(--card);
			color: var(--text);
			text-decoration: none;
			font-size: 14px;
			font-weight: 500;
			transition: background .12s;
		}
		.doc-item:hover { background: var(--card-hover); text-decoration: none; }
		.doc-item-icon { flex-shrink: 0; color: var(--muted); }
		.doc-item-title { flex: 1; }
		.doc-item-chev { flex-shrink: 0; color: var(--muted); }

		/* ── Search results ── */
		.search-results { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; display: none; }
		.search-results.active { display: block; }
		.results-section { margin-bottom: 32px; }
		.results-section-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); margin-bottom: 12px; }
		.result-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 13px 14px;
			border-radius: 10px;
			border: 1px solid var(--border);
			background: var(--card);
			color: var(--text);
			text-decoration: none;
			margin-bottom: 8px;
			transition: background .12s;
		}
		.result-item:hover { background: var(--card-hover); text-decoration: none; }
		.result-item-title { font-size: 14px; font-weight: 600; }
		.result-item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
		.result-chev { color: var(--muted); flex-shrink: 0; }
		.no-results { text-align: center; color: var(--muted); padding: 40px 18px; font-size: 15px; }

		/* ── Divider ── */
		.section-divider { border: none; border-top: 1px solid var(--border); max-width: 1100px; margin: 0 auto; }

		/* ── Hide browse when search is active ── */
		.browse-all.hidden { display: none; }
	</style>
</head>

<body>

	<nav class="simple-localnav" aria-label="Site navigation">
		<div class="localnav-inner">
			<a href="/" class="brand">
				<img src="https://cdn.alleghenycountyroleplay.com/branding/acrp-wite.png" alt="ACRP Logo">
				<span>Allegheny County Roleplay</span>
			</a>
			<div class="actions">
				<a href="/">Home</a>
				<a class="btn" href="https://portal.alleghenycountyroleplay.com">Login</a>
			</div>
		</div>
	</nav>

	<section class="hero-ar">
		<h1 class="hero-ar-title">Articles</h1>
		<p class="hero-ar-sub">The latest announcements and updates from the ACRP team.</p>
		<div class="search-wrap">
			<div class="search-inner">
				<input
					id="searchbar"
					class="search-input"
					type="text"
					placeholder="Search articles..."
					oninput="onSearchInput()"
					onkeydown="if(event.key==='Enter'){event.preventDefault();}"
					aria-label="Search articles"
				>
				<button type="button" class="search-btn" aria-label="Search">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21.172 24l-7.387-7.387A8.945 8.945 0 0 1 9 18C4.029 18 0 13.971 0 9S4.029 0 9 0s9 4.029 9 9a8.95 8.95 0 0 1-1.387 4.785L24 21.172 21.172 24zM9 2C5.14 2 2 5.14 2 9s3.14 7 7 7 7-3.14 7-7-3.14-7-7-7z"/></svg>
				</button>
			</div>
		</div>
	</section>

	<!-- Browse all (hidden during search) -->
	<div class="browse-all" id="browseAll">

		<!-- Content articles -->
		<div class="section">
			<h2 class="section-title">Latest</h2>
			<div class="article-grid" id="article-grid">
				<!-- populated by JS -->
			</div>
		</div>

		<hr class="section-divider">

		<!-- Legal documents -->
		<div class="section">
			<h2 class="section-title">Documents</h2>
			<div class="doc-list" id="doc-list">
				<!-- populated by JS -->
			</div>
		</div>

	</div>

	<!-- Search results (shown during search) -->
	<div class="search-results" id="searchResults">
		<div id="no-results" class="no-results" style="display:none;">No articles found. Try different search terms.</div>
		<div id="results-changelog" class="results-section" style="display:none;">
			<p class="results-section-title">Changelog</p>
			<div id="results-changelog-list"></div>
		</div>
		<div id="results-announcements" class="results-section" style="display:none;">
			<p class="results-section-title">Announcements</p>
			<div id="results-announcements-list"></div>
		</div>
		<div id="results-safety" class="results-section" style="display:none;">
			<p class="results-section-title">Safety</p>
			<div id="results-safety-list"></div>
		</div>
		<div id="results-legal" class="results-section" style="display:none;">
			<p class="results-section-title">Legal</p>
			<div id="results-legal-list"></div>
		</div>
	</div>

	<div id="footer-container"></div>
	<script src="../master.js"></script>

	<script>
		let articles = [];

		fetch('articles.json')
			.then(r => r.json())
			.then(data => {
				articles = data;
				buildCards();
			});

		/* ── Default display ── */
		function buildCards() {
			// Separate legal docs from actual content articles
			const content = articles
				.filter(a => a.category !== 'legal')
				.sort((a, b) => {
					// Sort newest first by parsing dates; undated items go last
					const da = a.date ? new Date(a.date) : new Date(0);
					const db = b.date ? new Date(b.date) : new Date(0);
					return db - da;
				});
			const legal = articles.filter(a => a.category === 'legal');

			// Article cards
			const ag = document.getElementById('article-grid');
			ag.innerHTML = '';
			content.forEach(a => {
				const card = document.createElement('a');
				card.className = 'article-card';
				card.href = a.link;
				const imgCls = a.fit === 'contain' ? 'article-card-img logo' : 'article-card-img';
				card.innerHTML = `
					<img class="${imgCls}" src="${esc(a.image || 'https://cdn.alleghenycountyroleplay.com/branding/acrp-wite.png')}" alt="${esc(a.name)}" loading="lazy">
					<div class="article-card-body">
						<span class="article-card-cat">${cap(a.category)}</span>
						${a.date ? `<span class="article-card-date">${esc(a.date)}</span>` : ''}
						<p class="article-card-title">${esc(a.name)}</p>
					</div>`;
				ag.appendChild(card);
			});

			// Document list
			const dl = document.getElementById('doc-list');
			dl.innerHTML = '';
			legal.forEach(a => {
				const item = document.createElement('a');
				item.className = 'doc-item';
				item.href = a.link;
				item.innerHTML = `
					<span class="doc-item-icon" aria-hidden="true">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
					</span>
					<span class="doc-item-title">${esc(a.name)}</span>
					<span class="doc-item-chev" aria-hidden="true">
						<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
					</span>`;
				dl.appendChild(item);
			});
		}

		/* ── Search ── */
		function onSearchInput() {
			const q = document.getElementById('searchbar').value.trim().toLowerCase();
			const browseAll = document.getElementById('browseAll');
			const searchResults = document.getElementById('searchResults');

			if (!q) {
				browseAll.classList.remove('hidden');
				searchResults.classList.remove('active');
				return;
			}

			browseAll.classList.add('hidden');
			searchResults.classList.add('active');
			renderSearch(q);
		}

		function renderSearch(q) {
			const cats = ['changelog', 'announcements', 'safety', 'legal'];
			const grouped = { changelog: [], announcements: [], safety: [], legal: [] };

			articles.forEach(a => {
				const score = scoreArticle(a, q);
				if (score > 0) {
					const cat = (a.category || '').toLowerCase();
					if (grouped[cat]) grouped[cat].push({ a, score });
				}
			});

			const total = cats.reduce((s, c) => s + grouped[c].length, 0);
			document.getElementById('no-results').style.display = total === 0 ? '' : 'none';

			cats.forEach(cat => {
				const sec = document.getElementById('results-' + cat);
				const list = document.getElementById('results-' + cat + '-list');
				if (!sec || !list) return;
				list.innerHTML = '';
				if (grouped[cat].length === 0) { sec.style.display = 'none'; return; }
				sec.style.display = '';
				grouped[cat].sort((x, y) => y.score - x.score).forEach(({ a }) => {
					const item = document.createElement('a');
					item.className = 'result-item';
					item.href = a.link;
					item.innerHTML = `
						<div>
							<div class="result-item-title">${esc(a.name)}</div>
							<div class="result-item-meta">${cap(a.category)}${a.date ? ' · ' + esc(a.date) : ''}</div>
						</div>
						<span class="result-chev">
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
						</span>`;
					list.appendChild(item);
				});
			});
		}

		function scoreArticle(a, q) {
			const title = (a.name || '').toLowerCase();
			const cat = (a.category || '').toLowerCase();
			let score = 0;
			if (title === q) score += 100;
			else if (title.startsWith(q)) score += 60;
			else if (title.includes(q)) score += 40;
			q.split(/\s+/).filter(Boolean).forEach(t => {
				if (title.includes(t)) score += 8;
				if (cat.includes(t)) score += 3;
			});
			return score;
		}

		function cap(s) {
			if (!s) return '';
			return s.charAt(0).toUpperCase() + s.slice(1);
		}

		function esc(s) {
			return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}
	</script>
</body>
</html>
